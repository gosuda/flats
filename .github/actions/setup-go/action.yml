name: Set up Go
description: >
  Installs the Go version from go.mod and restores the Go caches. Each writer job has
  its own build cache: setup-go's cache shares one key across all jobs, so the
  first job to finish decided what every job restored. The module cache is
  scoped to the root or NetBird dependency graph, with one writer per OS/scope.
  Build snapshots refresh at most weekly per cohort/dependency/toolchain key.
  Caches are saved only by pushes to main,
  which pull requests can restore without creating branch-local snapshots.

inputs:
  cache-key:
    description: Build cache cohort (normally the job; readers may share a writer).
    required: true
  module-scope:
    description: Dependency graph to cache (root or netbird, including root).
    default: "root"
  save-build:
    description: Whether this job may save its build cache on main.
    default: "true"
  save-modules:
    description: Whether this job saves the shared module cache on main.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - id: go
      shell: bash
      env:
        MODULE_SCOPE: ${{ inputs.module-scope }}
        ROOT_HASH: ${{ hashFiles('go.mod', 'go.sum') }}
        NETBIRD_HASH: ${{ hashFiles('go.mod', 'go.sum', 'netbird/go.mod', 'netbird/go.sum') }}
      run: bash "$GITHUB_ACTION_PATH/metadata.sh"

    # Last restore prefix migrates existing caches; Go validates cache freshness (these are trusted main caches).
    - if: steps.go.outputs.save == 'true' && inputs.save-modules == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.go.outputs.mod }}
        key: go-mod-v2-${{ runner.os }}-${{ inputs.module-scope }}-${{ steps.go.outputs.hash }}
        restore-keys: |
          go-mod-v2-${{ runner.os }}-${{ inputs.module-scope }}-
          go-mod-${{ runner.os }}-
    - if: steps.go.outputs.save != 'true' || inputs.save-modules != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.go.outputs.mod }}
        key: go-mod-v2-${{ runner.os }}-${{ inputs.module-scope }}-${{ steps.go.outputs.hash }}
        restore-keys: |
          go-mod-v2-${{ runner.os }}-${{ inputs.module-scope }}-
          go-mod-${{ runner.os }}-

    - if: steps.go.outputs.save == 'true' && inputs.save-build == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.go.outputs.build }}
        key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.toolchain }}-${{ inputs.cache-key }}-${{ inputs.module-scope }}--${{ steps.go.outputs.hash }}--${{ steps.go.outputs.week }}
        restore-keys: |
          go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.toolchain }}-${{ inputs.cache-key }}-${{ inputs.module-scope }}--${{ steps.go.outputs.hash }}--
          go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.toolchain }}-${{ inputs.cache-key }}-${{ inputs.module-scope }}--
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}--
    - if: steps.go.outputs.save != 'true' || inputs.save-build != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.go.outputs.build }}
        key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.toolchain }}-${{ inputs.cache-key }}-${{ inputs.module-scope }}--${{ steps.go.outputs.hash }}--${{ steps.go.outputs.week }}
        restore-keys: |
          go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.toolchain }}-${{ inputs.cache-key }}-${{ inputs.module-scope }}--${{ steps.go.outputs.hash }}--
          go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.toolchain }}-${{ inputs.cache-key }}-${{ inputs.module-scope }}--
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}--
