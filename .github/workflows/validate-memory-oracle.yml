name: Verify integrated notebook memory change

on:
  push:
    branches: [ci/validate-memory-oracle-20261126]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  memory:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      NOTEBOOK_LARGE_MEMORY_TESTS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Record source
        run: |
          mkdir integrated-memory-evidence
          git rev-parse HEAD > integrated-memory-evidence/source.txt
          sha256sum docs/gates.md internal/notebook/reader_entry_test.go internal/notebook/markdown_read_memory_test.go > integrated-memory-evidence/sources.sha256
          go version
      - name: Verify documentation
        run: make docs-verify 2>&1 | tee integrated-memory-evidence/docs-verify.log
      - name: Audit documentation reachability
        if: ${{ !cancelled() }}
        run: make docs-audit 2>&1 | tee integrated-memory-evidence/docs-audit.log
      - name: Run the normal CI shard
        if: ${{ !cancelled() }}
        run: scripts/ci-test.sh other -count=1 2>&1 | tee integrated-memory-evidence/other.log
      - name: Run the first notebook race lane
        if: ${{ !cancelled() }}
        run: scripts/ci-race.sh notebook-1 -count=1 2>&1 | tee integrated-memory-evidence/notebook-1.log
      - name: Run the second notebook race lane
        if: ${{ !cancelled() }}
        run: scripts/ci-race.sh notebook-2 -count=1 2>&1 | tee integrated-memory-evidence/notebook-2.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: integrated-memory-${{ github.sha }}
          path: integrated-memory-evidence
          if-no-files-found: error
          retention-days: 7
