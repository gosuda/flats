name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Selected races
        run: go test -race ./internal/core ./internal/api ./internal/app ./internal/mcpx ./internal/store ./internal/expose/portal
      - name: FILES concurrency races
        run: go test -race ./internal/runtime -run 'TestConcurrentFiles|TestWASIRejectsJSHostABI'
      - name: CGO-free Linux builds
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "$RUNNER_TEMP/flats-linux-$arch" ./cmd/flats
          done

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh scripts/build-release.sh scripts/install-smoke.sh
      - name: Build release archives
        run: |
          # Linux builds every platform to check the release build; macOS only its own.
          if [ "$RUNNER_OS" = macOS ]; then
            export FLATS_RELEASE_TARGETS="$(go env GOOS)/$(go env GOARCH)"
          fi
          scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: Start the systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for i in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Install, upgrade, crash and uninstall the service
        run: scripts/install-smoke.sh "$RUNNER_TEMP/dist" v0.0.0-ci
