name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/apps/docs/_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/apps/docs/_web/package-lock.json
      - run: npm ci
      - run: npm test

  # go test ./... split into the shards of scripts/ci-test.sh. A lane runs its
  # shards one after another, each as its own go test, so the serial codec and
  # budget tests (listed first) still have the runner to themselves.
  test:
    name: test (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: runtime-soak
            shards: runtime-codec runtime-soak
          - lane: runtime
            shards: runtime
          - lane: docs-budget
            shards: docs-budget docs-soak
          - lane: docs
            shards: docs
          - lane: board
            shards: board
          - lane: other
            shards: other
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: test-${{ matrix.lane }}
          # The board packages used to be tested in the other shard.
          restore-fallback: ${{ matrix.lane == 'board' && 'test-other' || '' }}
          # The other shard vets every package, so it downloads every module.
          save-modules: ${{ matrix.lane == 'other' }}
      - name: Verify module files
        if: matrix.lane == 'other'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        if: matrix.lane == 'other'
        run: go vet ./...
      - name: CI workflow helper regressions
        if: matrix.lane == 'other'
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_ci_*.py'
          python3 -B -m unittest discover -s scripts -p test_image_commits.py
      # Uncached, unlike TestRepositoryDocs: go test cannot see every Git
      # index change that adds or removes a link target.
      - name: Documentation links
        if: matrix.lane == 'other'
        run: make docs-check
      - name: Tests
        env:
          SHARDS: ${{ matrix.shards }}
        run: |
          failed=0
          for shard in $SHARDS; do
            scripts/ci-test.sh "$shard" || failed=1
          done
          exit "$failed"

  # NetBird is a separate module (./netbird) because its client needs replace
  # directives; go test ./... above does not reach it.
  netbird:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          # A cohort of its own since the job also builds the darwin/amd64
          # archive, whose objects the earlier netbird cache lacks.
          cache-key: netbird-darwin
          restore-fallback: netbird
          module-scope: netbird
          save-modules: "true"
      - name: Verify module files
        working-directory: netbird
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet and test
        working-directory: netbird
        run: |
          go vet ./...
          go test -race ./...
      # The only release target no other job builds. The release workflow uses
      # the same CGO-free cross-build on Linux; the container job builds the
      # Linux archives with the same script.
      - name: Build Intel macOS release archive
        run: FLATS_RELEASE_TARGETS="darwin/amd64" scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: The main module does not link NetBird
        run: |
          if go list -deps ./cmd/flats | grep -q github.com/netbirdio; then
            echo "cmd/flats links NetBird; it must stay in ./netbird" >&2
            exit 1
          fi
          if grep -q '^replace' go.mod; then
            echo "go.mod has replace directives; go install pkg@version would fail" >&2
            exit 1
          fi

  # The race tests in parallel lanes; see scripts/ci-race.sh.
  race:
    name: race (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [core-1, core-2, services, notebook-1, notebook-2, board-1, board-2]
        # The two lanes of a package compile it alike: one cache per package,
        # written only by its -1 lane.
        include:
          - {lane: core-1, cache: core}
          - {lane: core-2, cache: core}
          - {lane: services, cache: services}
          - {lane: notebook-1, cache: notebook}
          - {lane: notebook-2, cache: notebook}
          - {lane: board-1, cache: board}
          - {lane: board-2, cache: board}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: race-${{ matrix.cache }}
          save-build: ${{ !endsWith(matrix.lane, '-2') }}
          # The lanes used to share one race job.
          restore-fallback: race
      - name: Races
        run: scripts/ci-race.sh "${{ matrix.lane }}"

  notebook-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: test-notebook-memory
          restore-fallback: test-other
      - name: Large notebook memory tests
        run: |
          failed=0
          for group in reader markdown source; do
            scripts/ci-memory.sh "$group" || failed=1
          done
          exit "$failed"

  # Native Windows: the test suite, the service install smoke and its release
  # archive. The job runs as an administrator, so it cannot show that the
  # install needs no administrator rights: docs/release.md has that manual check.
  # It leaves out the docs-budget shard, whose wall-clock budgets belong to the
  # Linux shard, and internal/devreview, whose run command is Unix only.
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: windows
          module-scope: netbird
          save-modules: "true"
      - name: Build release archive
        id: archive
        run: FLATS_RELEASE_TARGETS=windows/amd64 scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: Tests
        # Verbose: the log keeps the skips and the timing lines of this job.
        # The test data goes to the runner's temporary drive. About 11 minutes
        # after a hosted runner boots, its system drive is read for about 45 s.
        # A flush there then takes seconds, and a document test that writes
        # meets the request limit (docs/gates.md). The step prints the boot
        # time, so that a later stall can be compared with it.
        # internal/site runs first, with the default temp directory: one of
        # its tests needs the short (8.3) names of the system drive, and the
        # temporary drive keeps none. It runs with -count=1, so that the test
        # runs on this runner and is not a result from the test cache.
        run: |
          failed=0
          go test -v -count=1 ./internal/site || failed=1
          mkdir -p "$RUNNER_TEMP/test-tmp"
          TMP=$(cygpath -w "$RUNNER_TEMP/test-tmp")
          TEMP=$TMP
          export TMP TEMP
          booted=$(pwsh -NoProfile -Command "(Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')" | tr -d '\r\n') || booted=unknown
          echo "the runner booted at $booted UTC, it is $(date -u '+%Y-%m-%d %H:%M:%S') UTC, and the test data is below $TEMP"
          for shard in runtime-soak runtime-codec runtime docs-soak docs board; do
            scripts/ci-test.sh "$shard" -v -timeout 30m || failed=1
          done
          # shellcheck disable=SC2046 # one argument per package path.
          go test -v -timeout 30m $(go list ./... | grep -v -E 'internal/(runtime|apps/docs|board|devreview)') || failed=1
          exit "$failed"
      # Runs after a failed test step too: the two answer different questions.
      - name: Install, crash, stop and uninstall the service
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        shell: pwsh
        run: scripts/install-smoke.ps1 "$env:RUNNER_TEMP\dist"

  # Native macOS: launchd service install smoke and its release archive.
  # The Linux install smoke runs in the container job, on its archives.
  install-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: install-script
          module-scope: netbird
          save-modules: "true"
      - name: Approval gate helper regressions
        timeout-minutes: 2
        run: |
          sh -n scripts/container-smoke.sh
          for gate_script in scripts/approval-gate.sh scripts/server-flat-gate.sh scripts/tailnet-gate.sh scripts/agent-gate.sh scripts/lifecycle-gate.sh; do
            bash -n "$gate_script" || exit 1
          done
          python3 -B scripts/test_approval_gate.py
      - name: Build release archive
        run: |
          # The archive this runner installs; the netbird and container jobs
          # build the other release targets.
          FLATS_RELEASE_TARGETS="$(go env GOOS)/$(go env GOARCH)"
          export FLATS_RELEASE_TARGETS
          scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: Install, upgrade, crash and uninstall the service
        run: scripts/install-smoke.sh "$RUNNER_TEMP/dist" v0.0.0-ci

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: container
          module-scope: netbird
      - name: Build Linux release archives
        run: FLATS_RELEASE_TARGETS="linux/amd64 linux/arm64" scripts/build-release.sh v0.0.0-ci dist
      - name: Lint
        run: |
          shellcheck -s sh install.sh scripts/ci-test.sh scripts/ci-race.sh scripts/ci-memory.sh scripts/build-release.sh scripts/install-smoke.sh scripts/container-smoke.sh scripts/build-commit-image.sh scripts/build-commit-images.sh scripts/lib-gate.sh
          shellcheck -s bash scripts/approval-gate.sh scripts/server-flat-gate.sh scripts/tailnet-gate.sh scripts/agent-gate.sh scripts/lifecycle-gate.sh
      - name: Approval gate helper regressions
        timeout-minutes: 2
        run: |
          sh -n scripts/container-smoke.sh
          for gate_script in scripts/approval-gate.sh scripts/server-flat-gate.sh scripts/tailnet-gate.sh scripts/agent-gate.sh scripts/lifecycle-gate.sh; do
            bash -n "$gate_script" || exit 1
          done
          python3 -B scripts/test_approval_gate.py
      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for _ in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          [ -S "$runtime/bus" ] || { echo "systemd user bus did not appear at $runtime/bus"; exit 1; }
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      # install.sh picks the linux/amd64 archive of this job's build.
      - name: Install, upgrade, crash and uninstall the service
        run: scripts/install-smoke.sh dist v0.0.0-ci
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for every release platform
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: Build the image for this runner
        run: docker buildx build --load -t flats:ci .
      - name: Validate Docker Compose configuration
        run: python3 scripts/compose-config-test.py
      - name: Exercise Docker Compose deployment
        run: python3 scripts/compose-smoke.py flats:ci
      - name: Bootstrap, deploy, restart and stop a container
        run: |
          tar -xzf dist/flats_linux_amd64.tar.gz -C "$RUNNER_TEMP" flats
          scripts/container-smoke.sh flats:ci v0.0.0-ci "$RUNNER_TEMP/flats"

  # Reuse this exact main tip's root-module verification. The called workflow
  # keeps the original push range and fully verifies every unproven commit.
  # Dispatch even after failed tests: a broken tip must not suppress valid
  # intermediate commits. A tip whose own tests failed is reported, not
  # verified again. Main CI completion now includes SHA images.
  commit-images:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/commit-images.yml
    with:
      verified-commit: ${{ needs.test.result == 'success' && github.sha || '' }}
      failed-commit: ${{ needs.test.result == 'failure' && github.sha || '' }}
