name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # go test ./... split into parallel shards; see scripts/ci-test.sh.
  test:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-soak, runtime-codec, runtime, docs-soak, docs-budget, docs, other]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: test-${{ matrix.shard }}
          # The other shard vets every package, so it downloads every module.
          save-modules: ${{ matrix.shard == 'other' }}
      - name: Verify module files
        if: matrix.shard == 'other'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        if: matrix.shard == 'other'
        run: go vet ./...
      - name: Tests
        run: scripts/ci-test.sh "${{ matrix.shard }}"

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: race
      - name: Selected races
        run: go test -race ./internal/core ./internal/api ./internal/app ./internal/mcpx ./internal/store ./internal/expose/portal
      - name: FILES concurrency races
        run: go test -race ./internal/runtime -run 'TestConcurrentFiles|TestWASIRejectsJSHostABI'

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: install-script
          save-modules: ${{ runner.os == 'macOS' }}
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh scripts/ci-test.sh scripts/build-release.sh scripts/install-smoke.sh scripts/container-smoke.sh scripts/build-commit-image.sh scripts/build-commit-images.sh
      - name: Build release archives
        run: |
          # Each leg builds the archive it installs. The macOS leg also builds
          # darwin/amd64; the container job builds both Linux archives, so
          # every release platform is built CGO-free somewhere.
          if [ "$RUNNER_OS" = macOS ]; then
            FLATS_RELEASE_TARGETS="darwin/amd64 darwin/arm64"
          else
            FLATS_RELEASE_TARGETS="$(go env GOOS)/$(go env GOARCH)"
          fi
          export FLATS_RELEASE_TARGETS
          scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: Start the systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for _ in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          [ -S "$runtime/bus" ] || { echo "systemd user bus did not appear at $runtime/bus"; exit 1; }
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Install, upgrade, crash and uninstall the service
        run: scripts/install-smoke.sh "$RUNNER_TEMP/dist" v0.0.0-ci

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: container
      - name: Build Linux release archives
        run: FLATS_RELEASE_TARGETS="linux/amd64 linux/arm64" scripts/build-release.sh v0.0.0-ci dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for every release platform
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: Build the image for this runner
        run: docker buildx build --load -t flats:ci .
      - name: Bootstrap, deploy, restart and stop a container
        run: |
          tar -xzf dist/flats_linux_amd64.tar.gz -C "$RUNNER_TEMP" flats
          scripts/container-smoke.sh flats:ci v0.0.0-ci "$RUNNER_TEMP/flats"
