name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # go test ./... split into parallel shards; see scripts/ci-test.sh.
  test:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-soak, runtime-codec, runtime, docs-soak, docs-budget, docs, other]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: test-${{ matrix.shard }}
          # The other shard vets every package, so it downloads every module.
          save-modules: ${{ matrix.shard == 'other' }}
      - name: Verify module files
        if: matrix.shard == 'other'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        if: matrix.shard == 'other'
        run: go vet ./...
      # Uncached, unlike TestRepositoryDocs: go test cannot see every Git
      # index change that adds or removes a link target.
      - name: Documentation links
        if: matrix.shard == 'other'
        run: make docs-check
      - name: Tests
        run: scripts/ci-test.sh "${{ matrix.shard }}"

  # NetBird is a separate module (./netbird) because its client needs replace
  # directives; go test ./... above does not reach it.
  netbird:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: netbird
      - name: Verify module files
        working-directory: netbird
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet, test and build
        working-directory: netbird
        run: |
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/flats
      - name: The main module does not link NetBird
        run: |
          if go list -deps ./cmd/flats | grep -q github.com/netbirdio; then
            echo "cmd/flats links NetBird; it must stay in ./netbird" >&2
            exit 1
          fi
          if grep -q '^replace' go.mod; then
            echo "go.mod has replace directives; go install pkg@version would fail" >&2
            exit 1
          fi

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: race
      - name: Selected races
        run: go test -race ./internal/core ./internal/api ./internal/app ./internal/mcpx ./internal/store ./internal/expose/portal
      - name: FILES concurrency races
        run: go test -race ./internal/runtime -run 'TestConcurrentFiles|TestWASIRejectsJSHostABI'
      - name: WebSocket resource limit races
        run: go test -race ./internal/runtime -run 'TestWebSocket(AdmissionCeiling|RejectedUpgrade|PostFailureReleasesSlot|IdleReadDeadline|ControlFramesKeepReadAlive|ServerPingsKeepIdleClientAlive|DefaultByteLimits)$'

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: install-script
          save-modules: ${{ runner.os == 'macOS' }}
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh install.sh scripts/ci-test.sh scripts/build-release.sh scripts/install-smoke.sh scripts/container-smoke.sh scripts/build-commit-image.sh scripts/build-commit-images.sh
          shellcheck -s bash scripts/approval-gate.sh scripts/server-flat-gate.sh scripts/tailnet-gate.sh scripts/agent-gate.sh scripts/lifecycle-gate.sh
      - name: Approval gate helper regressions
        timeout-minutes: 2
        run: |
          sh -n scripts/container-smoke.sh
          for gate_script in scripts/approval-gate.sh scripts/server-flat-gate.sh scripts/tailnet-gate.sh scripts/agent-gate.sh scripts/lifecycle-gate.sh; do
            bash -n "$gate_script" || exit 1
          done
          python3 -B scripts/test_approval_gate.py
      - name: Build release archives
        run: |
          # Build only the archive this runner installs. The separate Darwin
          # cross-build and container jobs cover the remaining release targets.
          FLATS_RELEASE_TARGETS="$(go env GOOS)/$(go env GOARCH)"
          export FLATS_RELEASE_TARGETS
          scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"
      - name: Start the systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for _ in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          [ -S "$runtime/bus" ] || { echo "systemd user bus did not appear at $runtime/bus"; exit 1; }
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Install, upgrade, crash and uninstall the service
        run: scripts/install-smoke.sh "$RUNNER_TEMP/dist" v0.0.0-ci

  # The Intel macOS archive is compile-only coverage; building it on Linux
  # keeps it off the native macOS install/launchd critical path. Release uses
  # the same CGO-free cross-build on Linux.
  darwin-cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: darwin-cross-build
      - name: Build Intel macOS release archive
        run: FLATS_RELEASE_TARGETS="darwin/amd64" scripts/build-release.sh v0.0.0-ci "$RUNNER_TEMP/dist"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: container
      - name: Build Linux release archives
        run: FLATS_RELEASE_TARGETS="linux/amd64 linux/arm64" scripts/build-release.sh v0.0.0-ci dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for every release platform
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: Build the image for this runner
        run: docker buildx build --load -t flats:ci .
      - name: Bootstrap, deploy, restart and stop a container
        run: |
          tar -xzf dist/flats_linux_amd64.tar.gz -C "$RUNNER_TEMP" flats
          scripts/container-smoke.sh flats:ci v0.0.0-ci "$RUNNER_TEMP/flats"
