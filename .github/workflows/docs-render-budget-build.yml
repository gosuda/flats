# Temporary branch-only job to regenerate committed browser assets.
# Remove this workflow after its generated artifacts are committed.
name: Docs security-fix artifact regeneration
on:
  push:
    branches:
      - fix/docs-remote-render-budget-2dbd8af8
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'gosuda/flats' && github.ref == 'refs/heads/fix/docs-remote-render-budget-2dbd8af8'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/apps/docs/_web/package-lock.json
      - name: Install, test, and rebuild the browser bundle
        run: |
          npm ci --prefix internal/apps/docs/_web
          npm test --prefix internal/apps/docs/_web
          npm run build --prefix internal/apps/docs/_web
      - name: Commit regenerated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/apps/docs/dist internal/apps/docs/testdata/spike.js internal/apps/docs/testdata/client-edits.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(docs): regenerate bundled assets for remote render budget'
            git push origin HEAD:refs/heads/fix/docs-remote-render-budget-2dbd8af8
          fi
