name: Release

# A pushed v* tag on main builds, tests and publishes its release.
# Run the workflow manually from main with an existing tag to attach the
# prebuilt archives to a release that was published without them. Existing
# assets are never replaced: a published archive and its checksum stay
# immutable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag on main to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Validate the run
        run: |
          case "$TAG" in
          v[0-9]*) ;;
          *) echo "release tags look like v1.2.3, got: $TAG"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "run the release workflow from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        id: resolve
        run: |
          commit=$(git rev-parse "$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

  # go test ./... split into the same parallel shards as CI. A single runner
  # running every package at once misses the wall-clock budgets of the docs
  # tests that CI runs alone; see scripts/ci-test.sh.
  test:
    name: test (${{ matrix.shard }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-soak, runtime-codec, runtime, docs-soak, docs-budget, docs, board, other]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      # The shard script comes from the workflow's commit, like the release
      # tooling, so a tag cut before it existed can still be tested. Each
      # package's shards complement each other, so the shards still cover
      # exactly go test ./... of the tag's source.
      - uses: actions/checkout@v4
        with:
          path: .release-tools
          sparse-checkout: scripts/ci-test.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Release refs only restore caches; no cache-saving action is loaded.
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: cache-paths
        run: |
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-paths.outputs.mod }}
          key: go-mod-v2-${{ runner.os }}-root-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-v2-${{ runner.os }}-root-
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-paths.outputs.build }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-test-${{ matrix.shard }}-root--${{ hashFiles('go.mod', 'go.sum') }}--read-only
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-test-${{ matrix.shard }}-root--${{ hashFiles('go.mod', 'go.sum') }}--
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-test-${{ matrix.shard }}-root--
      - name: Vet
        if: matrix.shard == 'other'
        run: go vet ./...
      - name: Test
        run: .release-tools/scripts/ci-test.sh "${{ matrix.shard }}"

  # Compile while tests run; only publication waits for both to succeed.
  build:
    needs: resolve
    outputs:
      archives: ${{ steps.archives.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Build the exact commit the resolve job checked, even if the tag moved.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      # The release tooling comes from the workflow's own commit, so a tag cut
      # before the tooling existed can still be built.
      - uses: actions/checkout@v4
        with:
          path: .release-tools
          sparse-checkout: scripts/build-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Keep the tools checkout out of the source status
        # Go stamps vcs.modified=true when git status shows untracked files.
        run: echo '/.release-tools/' >>.git/info/exclude
      # Release refs only restore caches; no cache-saving action is loaded.
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: cache-paths
        run: |
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-paths.outputs.mod }}
          key: go-mod-v2-${{ runner.os }}-netbird-${{ hashFiles('go.mod', 'go.sum', 'netbird/go.mod', 'netbird/go.sum') }}
          restore-keys: |
            go-mod-v2-${{ runner.os }}-netbird-
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-paths.outputs.build }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-container-netbird--${{ hashFiles('go.mod', 'go.sum', 'netbird/go.mod', 'netbird/go.sum') }}--read-only
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-container-netbird--${{ hashFiles('go.mod', 'go.sum', 'netbird/go.mod', 'netbird/go.sum') }}--
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-container-netbird--
      - name: Build archives
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          FLATS_SOURCE_DIR="$PWD" .release-tools/scripts/build-release.sh "$TAG" "$RUNNER_TEMP/dist"
          for archive in "$RUNNER_TEMP"/dist/*.tar.gz; do
            info=$(tar -xzOf "$archive" flats >"$RUNNER_TEMP/flats.bin" && go version -m "$RUNNER_TEMP/flats.bin")
            if ! printf '%s\n' "$info" | grep -q 'vcs.modified=false' ||
              ! printf '%s\n' "$info" | grep -q "vcs.revision=$COMMIT"; then
              echo "$archive was not built from clean source at $COMMIT"
              printf '%s\n' "$info"
              exit 1
            fi
          done
      - name: Stage verified archives for publication
        id: archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives-${{ needs.resolve.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [resolve, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download this run's verified archives
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.archives }}
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Verify staged archives
        run: (cd "$RUNNER_TEMP/dist" && sha256sum -c checksums.txt)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Backfill: upload fails rather than overwrite an existing asset.
            # Archives go first so checksums.txt never lists missing files.
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/*.tar.gz
            gh release upload "$TAG" "$RUNNER_TEMP/dist/checksums.txt"
            exit 0
          fi
          # Tags such as v1.2.0-rc.1 are prereleases and never become "latest",
          # which the installer and its upgrade path download by default.
          case "$TAG" in
          *-*) set -- --prerelease --latest=false ;;
          *) set -- --latest ;;
          esac
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --verify-tag --generate-notes --title "$TAG" "$@"

  image:
    needs: [resolve, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The Dockerfile comes from the workflow's commit, like the release
      # tooling. The binaries are the release's own attested archives, so the
      # image runs exactly what the release published.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download and verify the Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --dir dist --pattern 'flats_linux_*.tar.gz' --pattern checksums.txt
          (cd dist && sha256sum -c --ignore-missing checksums.txt)
          for archive in dist/flats_linux_*.tar.gz; do
            gh attestation verify "$archive" --repo "$GH_REPO"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Version aliases follow newly pushed release tags; backfilling an older
      # release never moves them. SHA refs belong only to Commit images, whose
      # development version differs from these release-stamped binaries.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
            org.opencontainers.image.version=${{ env.TAG }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
