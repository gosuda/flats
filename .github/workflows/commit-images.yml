name: Commit images

on:
  workflow_call:
    inputs:
      verified-commit:
        description: Exact main push SHA whose complete CI test matrix succeeded
        required: false
        default: ""
        type: string
      failed-commit:
        description: Exact main push SHA whose CI test matrix failed
        required: false
        default: ""
        type: string
      commit:
        description: Full SHA for the manual caller; ignored for main pushes
        required: false
        default: ""
        type: string

# Inherit the caller token. Explicit nested write permissions can exceed the
# read-only cap on fork/Dependabot PRs even when the calling job is skipped.

# No path filter or cancelling concurrency group: every introduced commit is
# retained, including the intermediate main commits in a multi-commit push.
jobs:
  select:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || !github.event.deleted) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.commits.outputs.matrix }}
      count: ${{ steps.commits.outputs.count }}
      verified-commit: ${{ steps.commits.outputs.verified-commit }}
      failed-commit: ${{ steps.commits.outputs.failed-commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Select commits
        id: commits
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          VERIFIED_COMMIT: ${{ inputs.verified-commit }}
          FAILED_COMMIT: ${{ inputs.failed-commit }}
        run: python3 scripts/image-commits.py

  image:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          # Same CGO-free Linux builds as CI/container. Reuse compiler objects,
          # not its differently versioned binaries; container is the sole writer.
          cache-key: container
          module-scope: netbird
          save-build: "false"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, test and publish each commit
        env:
          VERIFIED_COMMIT: ${{ needs.select.outputs.verified-commit }}
          FAILED_COMMIT: ${{ needs.select.outputs.failed-commit }}
          COMMIT_BATCH: ${{ toJSON(matrix.commits) }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: scripts/build-commit-images.sh
