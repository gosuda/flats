name: Notebook memory races

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-memory-race-${{ github.ref }}
  cancel-in-progress: false

jobs:
  race:
    name: race (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [notebook-large-reader, notebook-large-markdown, notebook-large-source]
        include:
          - {lane: notebook-large-reader, cache: notebook}
          - {lane: notebook-large-markdown, cache: notebook}
          - {lane: notebook-large-source, cache: core}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          # Main's routine race lanes compile the same package test binaries.
          cache-key: race-${{ matrix.cache }}
          save-build: "false"
      - name: Races
        run: scripts/ci-race.sh "${{ matrix.lane }}"
