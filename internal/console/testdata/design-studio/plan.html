<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Grind — Choose a plan</title>
<script type="application/json" data-flats-tweaks>
{
  "accent": {"type": "color", "label": "Accent", "value": "#b4532a"},
  "radius": {"type": "number", "label": "Corner radius", "value": 16, "min": 0, "max": 32, "step": 2, "unit": "px"}
}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone">
  <header class="top">
    <a href="home.html" style="color: inherit">Back</a>
    <span class="brand"><span class="dot" aria-hidden="true"></span>Daily Grind</span>
    <span aria-hidden="true"></span>
  </header>
  <section class="content">
    <h2>Choose your plan</h2>
    <p>Every plan includes free delivery.</p>
    <a class="card" href="checkout.html">
      <span class="row"><strong>Solo</strong><span class="price">[PRICE]</span></span>
      <span>250 g every week</span>
    </a>
    <a class="card picked" href="checkout.html">
      <span class="row"><strong>Duo</strong><span class="badge">Most popular</span></span>
      <span class="row"><span>500 g every week</span><span class="price">[PRICE]</span></span>
    </a>
    <a class="card" href="checkout.html">
      <span class="row"><strong>Office</strong><span class="price">[PRICE]</span></span>
      <span>1 kg every week</span>
    </a>
    <span class="spacer"></span>
    <a class="button" href="checkout.html">Continue with Duo</a>
  </section>
</main>
</body>
</html>
