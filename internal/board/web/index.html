<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Board</title>
<script src="/_board/app/boot.js"></script>
<link rel="stylesheet" href="/_board/app/app.css">
<script type="module" src="/_board/app/app.js"></script>
</head>
<body>
<header class="top">
  <div class="title">
    <button id="frames-btn" type="button" class="btn icon" aria-label="Frame list" title="Frame list" aria-expanded="false" aria-controls="frame-list"><span data-icon="board"></span></button>
    <h1 id="board-title">Board</h1>
    <span class="chip" id="access-chip" hidden></span>
  </div>
  <div class="save" role="status"></div>
  <span id="me-label" class="me" hidden></span>
  <button id="name-btn" type="button" class="btn ghost" aria-label="Choose a name to edit" title="Choose a name to edit" hidden><span data-icon="pen"></span><span class="lbl">Choose a name to edit</span></button>
  <div class="spacer"></div>
  <button class="people" type="button" aria-haspopup="dialog" aria-expanded="false" hidden></button>
  <button id="find-btn" type="button" class="btn" aria-label="Find" aria-keyshortcuts="Meta+F Control+F" title="Find (⌘F)"><span data-icon="search"></span><span class="lbl">Find</span><span class="kbd">⌘F</span></button>
  <button id="history-btn" type="button" class="btn priv-only" aria-label="History" title="History" aria-expanded="false" aria-controls="history"><span data-icon="history"></span><span class="lbl">History</span></button>
  <button id="export-btn" type="button" class="btn" aria-label="Export" title="Export"><span data-icon="download"></span><span class="lbl">Export</span></button>
  <button id="share-btn" type="button" class="btn ghost priv-only" aria-label="Send to agent" title="Send to agent" disabled><span data-icon="send"></span><span class="lbl">Send to agent</span></button>
</header>
<div class="banners"></div>
<nav class="tools" aria-label="Tools"></nav>
<aside id="frame-list" class="panel left" aria-label="Frame list" hidden></aside>
<main class="board" aria-label="Board canvas" tabindex="-1">
  <canvas class="layer-static" aria-hidden="true"></canvas>
  <canvas class="layer-dynamic" aria-hidden="true"></canvas>
  <div class="board-ui"></div>
</main>
<aside id="a11y" class="a11y-panel" aria-labelledby="a11y-title">
  <h2 id="a11y-title">Element list</h2>
  <p class="ph">↑↓ move · ← → collapse or expand frames · Enter edits text (Esc returns here) · Shift+arrow moves 10px · Delete deletes · Esc clears the selection</p>
  <ul id="element-tree" role="tree" aria-label="Board elements"></ul>
</aside>
<div class="zoom">
  <button type="button" class="b" data-act="out" aria-label="Zoom out (⌘-)" title="Zoom out (⌘-)"><span data-icon="minus"></span></button>
  <button type="button" class="z" data-act="menu" aria-haspopup="menu" aria-expanded="false">100%</button>
  <button type="button" class="b" data-act="in" aria-label="Zoom in (⌘+)" title="Zoom in (⌘+)"><span data-icon="plus"></span></button>
  <button type="button" class="b" data-act="fit" aria-label="Fit all (⇧1)" title="Fit all (⇧1)"><span data-icon="fit"></span></button>
</div>
<div class="undo">
  <button type="button" class="b" data-act="undo" aria-label="Undo (⌘Z)" title="Undo (⌘Z)"><span data-icon="undo"></span></button>
  <button type="button" class="b" data-act="redo" aria-label="Redo (⇧⌘Z)" title="Redo (⇧⌘Z)"><span data-icon="redo"></span></button>
</div>
<nav class="mobile-nav" aria-label="View">
  <button type="button" class="btn" data-act="frames"><span data-icon="list"></span><span>Frames</span></button>
  <button type="button" class="btn" data-act="find"><span data-icon="search"></span><span>Find</span></button>
  <button type="button" class="btn" data-act="fit"><span data-icon="fit"></span><span>Fit</span></button>
</nav>
<aside id="history" class="panel right" aria-label="History" hidden></aside>
<div class="toasts"></div>
<div id="announce" class="sr" aria-live="polite"></div>
<noscript><p class="noscript">The board needs JavaScript.</p></noscript>
</body>
</html>
